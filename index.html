<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Estadio Lightshow Experiencia</title>
    <style>
        body { margin: 0; padding: 0; background-color: #050505; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; justify-content: space-between; align-items: center; height: 100vh; text-align: center; box-sizing: border-box; padding: 40px 20px; transition: background-color 0.03s ease; overflow: hidden; }
        .header-zone { margin-top: 20px; }
        h1 { font-size: 2.2rem; letter-spacing: 2px; margin: 0 0 10px 0; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
        p { font-size: 1.1rem; color: #b3b3b3; max-width: 320px; margin: 0 auto; line-height: 1.5; }
        .btn-container { display: flex; justify-content: center; align-items: center; flex-grow: 1; }
        .btn-pulsar { background: linear-gradient(135deg, #00ffcc, #0055ff); border: none; color: white; width: 180px; height: 180px; font-size: 1.3rem; font-weight: bold; border-radius: 50%; cursor: pointer; box-shadow: 0 0 30px rgba(0, 255, 204, 0.4); text-transform: uppercase; }
        .footer-zone { margin-bottom: 20px; width: 100%; }
        .status { font-size: 1rem; color: #00ffcc; font-weight: 500; }
        .instruccion-iphone { display: none; margin-top: 15px; font-size: 0.85rem; color: #ffcc00; background: rgba(255, 204, 0, 0.1); padding: 10px; border-radius: 8px; border: 1px solid rgba(255, 204, 0, 0.2); }
        /* Video oculto necesario para que Android no apague la cámara/flash por inactividad */
        #hiddenVideo { display: none; width: 1px; height: 1px; }
    </style>
</head>
<body>
    <video id="hiddenVideo" autoplay playsinline muted></video>

    <div class="header-zone">
        <h1 id="mainTitle">LIGHTSHOW ESTADIO</h1>
        <p id="mainDesc">Sincroniza tu dispositivo con el sonido local.</p>
    </div>
    <div class="btn-container">
        <button class="btn-pulsar" id="startBtn">ACTIVAR<br>LUCES</button>
    </div>
    <div class="footer-zone">
        <div class="status" id="statusText">Esperando conexión...</div>
        <div class="instruccion-iphone" id="iphoneNotice">
            <strong>⚠️ USUARIO DE IPHONE:</strong> Apunta la pantalla hacia la cancha. ¡Brillará con el ritmo!
        </div>
    </div>
    <script>
        const startBtn = document.getElementById('startBtn');
        const statusText = document.getElementById('statusText');
        const iphoneNotice = document.getElementById('iphoneNotice');
        const mainTitle = document.getElementById('mainTitle');
        const hiddenVideo = document.getElementById('hiddenVideo');
        const bodyElement = document.body;
        let audioContext, analyser, microphone, javascriptNode, track; 
        let isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

        // --- AJUSTES EXCLUSIVOS PARA ESTADIO ABIERTO ---
        let umbralDinamico = 50; 
        let ruidosCapturados = [];
        let calibrando = true;
        const MULTIPLICADOR_UMBRAL = 2.2; 

        // --- COOLDOWN Y RENDIMIENTO ---
        let ultimoTiempoParpadeo = 0;
        const COOLDOWN_PARPADEO = 120; // LÍNEA 56: Controla la velocidad del parpadeo (en milisegundos)
        let tiempoUltimoPulsoFuerte = 0;
        const TIEMPO_APAGADO_PANTALLA = 400; 
        let estadoLuzActual = false; 

        startBtn.addEventListener('click', async () => {
            statusText.innerText = "Calibrando sonido ambiente (1s)...";
            try {
                // Android requiere activar la cámara trasera de forma explícita
                if (!isIos) {
                    try {
                        const videoStream = await navigator.mediaDevices.getUserMedia({ 
                            video: { facingMode: { exact: "environment" } } 
                        });
                        hiddenVideo.srcObject = videoStream; // Engaña a Android para mantener viva la cámara
                        
                        // CORRECCIÓN CLAVE: Extraer la pista [0] individual del array
                        track = videoStream.getVideoTracks()[0]; 
                    } catch (e) {
                        console.log("Linterna o cámara trasera no disponible");
                    }
                }
                
                const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                }

                const filtroEnfoque = audioContext.createBiquadFilter();
                filtroEnfoque.type = "lowpass";
                filtroEnfoque.frequency.setValueAtTime(150, audioContext.currentTime);

                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(audioStream);
                javascriptNode = audioContext.createScriptProcessor(1024, 1, 1);

                analyser.smoothingTimeConstant = 0.08; 
                analyser.fftSize = 256;

                microphone.connect(filtroEnfoque);
                filtroEnfoque.connect(analyser);
                analyser.connect(javascriptNode);
                javascriptNode.connect(audioContext.destination);

                startBtn.style.display = 'none';
                mainTitle.innerText = "¡CONECTADO AL SHOW!";
                if (isIos) iphoneNotice.style.display = "block";

                setTimeout(() => {
                    calibrando = false;
                    if(ruidosCapturados.length > 0) {
                        const promedioRuidoBase = ruidosCapturados.reduce((a, b) => a + b, 0) / ruidosCapturados.length;
                        umbralDinamico = Math.max(promedioRuidoBase * MULTIPLICADOR_UMBRAL, 35); 
                    }
                    statusText.innerText = "¡Sincronizado! Disfruta el show.";
                    tiempoUltimoPulsoFuerte = Date.now();
                }, 1000);

                javascriptNode.onaudioprocess = () => {
                    const array = new Uint8Array(analyser.frequencyBinCount);
                    analyser.getByteFrequencyData(array);
                    let values = 0;
                    
                    const rangoMusical = Math.min(array.length, 8); 
                    for (let i = 0; i < rangoMusical; i++) { values += array[i]; }
                    const promedioVolumen = values / rangoMusical;

                    if (calibrando) {
                        ruidosCapturados.push(promedioVolumen);
                    } else {
                        const ahora = Date.now();

                        if (ahora - ultimoTiempoParpadeo >= COOLDOWN_PARPADEO) {
                            if (promedioVolumen > umbralDinamico) { 
                                tiempoUltimoPulsoFuerte = ahora;
                                ejecutarParpadeo(true); 
                                ultimoTiempoParpadeo = ahora;
                            } else if (estadoLuzActual && (ahora - tiempoUltimoPulsoFuerte > 80)) {
                                ejecutarParpadeo(false);
                                ultimoTiempoParpadeo = ahora;
                            }
                        }

                        if (estadoLuzActual && (ahora - tiempoUltimoPulsoFuerte >= TIEMPO_APAGADO_PANTALLA)) {
                            ejecutarParpadeo(false);
                        }
                    }
                };
            } catch (err) {
                statusText.innerText = "Error de permisos o hardware.";
                console.error(err);
            }
        });

        let toggleColor = false;

        function ejecutarParpadeo(activar) {
            if (activar === estadoLuzActual && COOLDOWN_PARPADEO < 50) return; 
            estadoLuzActual = activar;

            if (activar) {
                bodyElement.style.backgroundColor = toggleColor ? "#721227" : "#5A0000"; 
                toggleColor = !toggleColor;

                // Control robusto del flash para Android
                if (track && typeof track.applyConstraints === 'function') {
                    track.applyConstraints({ advanced: [{ torch: true }] }).catch((err) => console.log("Fallo encendido torch", err));
                }
            } else {
                bodyElement.style.backgroundColor = "#050505"; 
                if (track && typeof track.applyConstraints === 'function') {
                    track.applyConstraints({ advanced: [{ torch: false }] }).catch((err) => console.log("Fallo apagado torch", err));
                }
            }
        }
    </script>
</body>
</html>
